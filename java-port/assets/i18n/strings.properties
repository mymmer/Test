shop.bowman.name=Bowmen
shop.bowman.desc=Rapid arrows, low damage. Its range stretches far UPWARD, so it always reaches flyers.
shop.ballista.name=Ballista
shop.ballista.desc=Heavy piercing bolt, slow reload. +200% damage to anything airborne.
shop.cannon.name=Cannon
shop.cannon.desc=Explosive splash on the densest cluster. +200% damage to Heavy ground units.
shop.wall.name=Reinforce Walls
shop.wall.desc=More max health, another tower slot, and a visibly tougher keep.
shop.bounce.name=Bounce
shop.bounce.desc=Thrown mobs bounce again and again. Every bounce adds impact damage and a longer stun.
shop.grab.name=Grab Strength
shop.grab.desc=Raises the weight your cursor can lift. Heavy tanks need Lv.3.
shop.multi.name=Magnetic Gloves
shop.multi.desc=Snatch extra mobs near the one you grab and fling the whole bunch at once.
shop.outpost.name=Outpost
shop.outpost.desc=Garrison the background tower. Mobs cannot reach it, so it never stops firing.
shop.barricade.name=Barricade
shop.barricade.desc=A wall out in the field. Ground troops must break it before they reach you.
shop.spikes.name=Spike Walls
shop.spikes.desc=Iron spikes along the parapet. Anything that hits the wall takes damage back.
shop.repair.name=Repair
shop.repair.desc=Instantly restore 40% of maximum castle health.

