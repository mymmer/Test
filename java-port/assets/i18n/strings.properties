# --- main menu ----------------------------------------------------------------
menu.title=CASTLE DEFENSE
menu.settings=SETTINGS
menu.best=BEST  {0}
menu.pickMode=Pick a mode below to begin
menu.intro.waves=Endless waves. 8 mob types, 3 bosses, one castle.
menu.intro.throw=THROW - hold and drag a ground mob, then flick and release to hurl it. The fall hurts, and it crushes whatever it lands on.
menu.intro.tanks=TANKS - a Siege Ram's plating comes off first: drag AWAY from the castle to rip it apart. Once bare, drag TOWARDS the castle to shove it forward, or lift it outright with enough Grab Strength.
menu.intro.bosses=BOSSES - rip the Troll King's CROWN off and fling it, flick the Lich Lord's STAFF out of his hands, batter the Dragon's CLAWS.
menu.intro.overcharge=Drag back on a Ballista or Cannon to overcharge-fire it.
menu.intro.score=Long flings score big and mid-air hits multiply them. A crowded screen pays more gold - blow the CHALLENGE HORN for even more.

