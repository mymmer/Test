# ==============================================================================
#  Castle Defense -- English strings (the source language)
# ==============================================================================
#  Keys are grouped by screen.  Adding a language means copying this file to
#  strings_<lang>.properties and translating the right-hand side; no Java
#  changes are needed.
#
#  GAMEPLAY NEVER IDENTIFIES ANYTHING BY THESE STRINGS.  A talent is
#  "light_fingers", a shop item is "ballista", a skill is "lightning"; the keys
#  below are derived from those stable ids.  Translating this file cannot move a
#  gameplay identity.
#
#  StringsCompletenessTest walks the real tables and fails the build if a talent,
#  shop item or skill is missing a name or a description here.

