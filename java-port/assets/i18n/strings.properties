# --- difficulty ---------------------------------------------------------------
difficulty.easy=EASY
difficulty.normal=NORMAL
difficulty.hard=HARD
difficulty.easy.blurb=Enemies scale 20% slower, walk 10% slower, you earn 15% more gold, and the cursor never has to wait between grabs.
difficulty.normal.blurb=The game as designed. Standard scaling, standard pay, a quarter-second between grabs.
difficulty.hard.blurb=Enemies move 40% faster, health scales 60% harder per tier, bosses fire twice as fast, the horn calls in elites, and every grab costs you half a second.

