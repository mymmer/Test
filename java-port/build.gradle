// ============================================================================
//  Root build: settings shared by every module.
// ============================================================================
//  Versions are never written here -- they live in gradle/libs.versions.toml.

subprojects {
    repositories {
        mavenCentral()
        google()
    }

    //  Settings that are safe for EVERY module, Android included.
    //
    //  Deliberately NOT here: javac's `--release`.  Two different compilation
    //  models are in play and conflating them breaks the Android build:
    //
    //    * Plain JVM modules (:core, :lwjgl3) are compiled by the Java plugin.
    //      They set `options.release = 17` themselves, which pins both the
    //      language level and the JDK API surface they may call.
    //
    //    * :android is compiled by AGP, which derives Java compatibility from
    //      `android { compileOptions { source/targetCompatibility } }` and pairs
    //      it with D8/R8 and core-library desugaring.  Forcing `--release` onto
    //      those JavaCompile tasks fights AGP's own configuration -- it bypasses
    //      the bootclasspath AGP sets up (android.jar) and disables the
    //      desugaring contract, which is exactly the combination that produces
    //      confusing "cannot find symbol" or API-level errors.
    //
    //  So: never add `options.release` to a `subprojects` block.  Set it per
    //  JVM module, and let AGP own Android.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all', '-Xlint:-processing']
    }
}

// `gradle whatBuilds` prints which modules are active and why, which is the
// quickest way to see whether the Android SDK was picked up.
tasks.register('whatBuilds') {
    group = 'help'
    description = 'Lists the modules included in this build and the Android SDK decision.'
    def names = subprojects.collect { it.path }
    def hasAndroid = project.hasProperty('androidSdkPresent') ? androidSdkPresent : false
    def sdkDir = project.hasProperty('androidSdkDir') ? androidSdkDir : null
    def sdkSource = project.hasProperty('androidSdkSource') ? androidSdkSource : null
    doLast {
        println "modules: ${names.join(', ')}"
        if (hasAndroid) {
            println "android SDK: ${sdkDir}  (from ${sdkSource})"
        } else {
            println 'android SDK: not configured -- :android omitted'
        }
    }
}

// The Phase 2 gate that this sandbox cannot close: assembling the Android app.
//
// This is more than an alias for `:android:assembleDebug`.  Without the module
// that command fails with Gradle's generic "project not found", which reads
// like a broken build script rather than a missing SDK.  This task explains the
// real reason, and on a configured machine it reports where the APK landed so
// the gate can be closed with evidence.
tasks.register('verifyAndroid') {
    group = 'verification'
    description = 'Assembles the Android debug APK -- the Phase 2 Android gate.'
    def hasAndroid = project.hasProperty('androidSdkPresent') ? androidSdkPresent : false
    if (hasAndroid) {
        dependsOn ':android:assembleDebug'
    }
    doLast {
        if (!hasAndroid) {
            throw new GradleException(
                    'Cannot verify Android: no SDK is configured, so the :android ' +
                    'module is not in this build.\n' +
                    'Set sdk.dir in java-port/local.properties (or ANDROID_HOME) ' +
                    'and run ./gradlew verifyAndroid again.')
        }
        def apks = fileTree("${project(':android').layout.buildDirectory.get()}/outputs/apk/debug") {
            include '**/*.apk'
        }.files
        if (apks.isEmpty()) {
            throw new GradleException('assembleDebug produced no APK.')
        }
        apks.each { println "android APK: ${it} (${(it.length() / 1024 / 1024).round(2)} MB)" }
        println 'Android gate: PASSED -- record it in PORTING_STATUS.md.'
    }
}


// ============================================================================
//  Asset pipeline:  raw-assets/skins/<skin>/*.png  ->  assets/skins/<skin>/units.atlas
// ============================================================================
//  Run it with:  ./gradlew packAssets
//
//  The rule from the brief: artwork is maintained as individual PNGs, and
//  nobody ever hand-maintains sprite-sheet coordinates.  Code asks the atlas
//  for a region by name; this task is what makes that name exist.
//
//  gdx-tools is resolved into its own configuration so the packer never lands
//  on any module's runtime classpath.

configurations {
    texturePacker
}

dependencies {
    texturePacker "com.badlogicgames.gdx:gdx-tools:${libs.versions.gdx.get()}"
}

tasks.register('packAssets') {
    group = 'build'
    description = 'Packs raw-assets/skins/<skin>/*.png into assets/skins/<skin>/units.atlas'

    def rawRoot = file('raw-assets/skins')
    def outRoot = file('assets/skins')
    inputs.dir(rawRoot).optional()
    outputs.dir(outRoot)

    doLast {
        if (!rawRoot.exists()) {
            println "packAssets: no ${rawRoot} -- nothing to pack " +
                    '(the game runs procedurally without artwork)'
            return
        }
        def skins = rawRoot.listFiles()?.findAll { it.isDirectory() } ?: []
        def withPngs = skins.findAll { dir ->
            dir.listFiles()?.any { it.name.toLowerCase().endsWith('.png') }
        }
        if (withPngs.isEmpty()) {
            println 'packAssets: no skin folders contain PNGs -- nothing to pack'
            return
        }
        withPngs.each { dir ->
            def outDir = new File(outRoot, dir.name)
            outDir.mkdirs()

            //  TexturePacker reads pack.json from the input folder.  It is
            //  written here rather than committed so the packing rules live in
            //  one place and an artist never has to maintain one.
            //
            //  useIndexes:false is the important one.  By default the packer
            //  treats a trailing _0 / _1 as libGDX's animation *index* and
            //  collapses scout_walk_0.png and scout_walk_1.png into one region
            //  called "scout_walk" -- which would silently break the documented
            //  rule that a region is named after its file, and with it the
            //  frame lookups in AnimationSet.
            new File(dir, 'pack.json').text = '''{
  "useIndexes": false,
  "filterMin": "Nearest",
  "filterMag": "Nearest",
  "maxWidth": 2048,
  "maxHeight": 2048,
  "paddingX": 2,
  "paddingY": 2,
  "duplicatePadding": true,
  "bleed": true,
  "stripWhitespaceX": false,
  "stripWhitespaceY": false,
  "combineSubdirectories": true
}
'''
            println "packAssets: ${dir.name} -> ${outDir}/units.atlas"
            javaexec {
                classpath = configurations.texturePacker
                mainClass = 'com.badlogic.gdx.tools.texturepacker.TexturePacker'
                args = [dir.absolutePath, outDir.absolutePath, 'units']
            }
        }
        println "packAssets: packed ${withPngs.size()} skin(s)"
    }
}
