// ============================================================================
//  :core -- the platform-independent game.
// ============================================================================
//  MUST NOT depend on: android.*, LWJGL, or any backend.  Only gdx-core.
//  Anything platform-specific is reached through an interface implemented by
//  the launchers (see platform/ from Phase 3 onward).

plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.toVersion(libs.versions.java.get())
    targetCompatibility = JavaVersion.toVersion(libs.versions.java.get())
}

tasks.withType(JavaCompile).configureEach {
    options.release = libs.versions.java.get() as Integer
}

dependencies {
    api libs.gdx.core

    // Headless backend + desktop natives are TEST-ONLY: they let the JUnit
    // suite build a real Gdx application without a window or a GPU, which is
    // what makes the simulation testable in CI.
    testImplementation libs.gdx.backend.headless
    testImplementation variantOf(libs.gdx.platform) { classifier('natives-desktop') }
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
    //  Gdx.files.internal resolves against the working directory, so point the
    //  tests at the same assets root the launchers use.  This is what lets the
    //  shipped data files be asserted against the Python values.
    workingDir = rootProject.file('assets')
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}


// ============================================================================
//  The Phase 12 simulation benchmark
// ============================================================================
//
//  A JavaExec rather than a test task: these are numbers a person reads and
//  compares against a recorded baseline, not assertions.  A timing that fails
//  the build on a busy machine is a timing everyone learns to ignore.
tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Times the simulation across the Phase 12 scenarios.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mymmer.castledefense.bench.BenchmarkMain'
    //  Deterministic conditions: the same heap every run, and no JIT surprises
    //  from a shrinking one mid-measurement.
    //  Same working directory as the test task: the data tables are resolved
    //  relative to assets/, and a benchmark that cannot load enemies.json is
    //  not measuring the game.
    workingDir = rootProject.file('assets')
    jvmArgs = ['-Xms512m', '-Xmx512m', '-XX:+UseSerialGC']
}
