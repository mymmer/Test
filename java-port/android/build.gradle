// ============================================================================
//  :android -- the production target.
// ============================================================================
//  This module is only part of the build when an Android SDK is configured
//  (see settings.gradle).  It contains the launcher and the platform
//  implementations; no gameplay code lives here, and :core never depends on it.

plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.mymmer.castledefense'
    compileSdk libs.versions.androidCompileSdk.get() as Integer

    defaultConfig {
        applicationId 'com.mymmer.castledefense'
        minSdk libs.versions.androidMinSdk.get() as Integer
        targetSdk libs.versions.androidTargetSdk.get() as Integer
        versionCode 1
        versionName '0.1.0-phase2'
    }

    //  Java compatibility for this module is AGP's business, not the Java
    //  plugin's.  Setting it here (rather than with javac --release) is what
    //  keeps the android.jar bootclasspath and the desugaring contract intact.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        //  Core-library desugaring backports the Java 8+ library APIs
        //  (java.time, java.util.stream, Optional, java.util.function, ...) to
        //  every API level this app supports, so minSdk 21 does not restrict
        //  which JDK APIs `core` may use.  Whether a given API belongs in a
        //  per-frame gameplay loop is a performance question, decided
        //  separately -- see java-port/README.md "Java APIs and Android".
        coreLibraryDesugaringEnabled true
    }

    sourceSets {
        main {
            // one shared assets folder with the desktop build
            assets.srcDirs = [rootProject.file('assets')]
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/robovm/ios/robovm.xml', 'META-INF/DEPENDENCIES',
                         'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

//  Guard: if anyone ever adds `options.release` to this module (directly or
//  through a subprojects block), fail the build rather than producing an APK
//  whose bytecode was compiled against the wrong bootclasspath.
tasks.withType(JavaCompile).configureEach {
    doFirst {
        if (options.release.present) {
            throw new GradleException(
                    "javac --release must not be set on the Android module: AGP " +
                    "owns Java compatibility here via android.compileOptions. " +
                    "Remove it from " + path)
        }
    }
}

//  Declared BEFORE the dependencies block that uses it: Gradle evaluates a
//  build script top to bottom, so `natives "..."` below is only a known method
//  once this exists.  It was underneath, which meant the :android module could
//  not even be configured -- the first thing the Android gate found when an SDK
//  finally made the module part of the build.
configurations { natives }

dependencies {
    //  Pin the transitive androidx.core that gdx-backend-android brings in.
    //  Unpinned it resolves to 1.17.0, which requires compileSdk 36 and AGP
    //  8.9.1; this project's AGP 8.7.3 / compileSdk 35 pairing is intentional
    //  and is not moved to accommodate a transitive dependency.  1.15.0 is the
    //  newest release that compiles against 35.
    //  `strictly`, not a plain constraint: a constraint is a FLOOR, and
    //  gdx-backend-android asks for 1.17.0 outright, so a floor of 1.15.0 leaves
    //  1.17.0 winning.  strictly caps it.
    constraints {
        implementation("androidx.core:core") {
            version { strictly libs.versions.androidxCore.get() }
            because 'AGP 8.7.3 and compileSdk 35 are pinned deliberately'
        }
    }

    implementation project(':core')
    implementation libs.gdx.backend.android
    coreLibraryDesugaring libs.android.desugar.jdk.libs

    // libGDX ships its Android natives as per-ABI artifacts.
    natives "com.badlogicgames.gdx:gdx-platform:${libs.versions.gdx.get()}:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:${libs.versions.gdx.get()}:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:${libs.versions.gdx.get()}:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:${libs.versions.gdx.get()}:natives-x86_64"
}

// Unpacks the per-ABI .so files libGDX needs into libs/<abi>/.
tasks.register('copyAndroidNatives') {
    group = 'build'
    description = 'Copies the libGDX native libraries into android/libs/<abi>.'
    def outputDir = file('libs')
    outputs.dir(outputDir)
    doFirst {
        configurations.natives.files.each { jar ->
            //  Everything after "natives-", not the last hyphenated token:
            //  gdx-platform-1.14.2-natives-armeabi-v7a.jar tokenises to "v7a",
            //  which is not an ABI directory name and made mergeDebugNativeLibs
            //  reject the whole build.  arm64-v8a had the same problem; x86 and
            //  x86_64 happened to work, which is why it looked fine.
            def abi = jar.name.replaceAll(/^.*natives-/, '').replace('.jar', '')
            def dest = new File(outputDir, abi)
            dest.mkdirs()
            copy {
                from zipTree(jar)
                into dest
                include '*.so'
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.contains('merge') && task.name.contains('JniLibFolders')) {
        task.dependsOn 'copyAndroidNatives'
    }
}
